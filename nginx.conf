# Hôte secondaire → 301 vers le canonique (préserve chemin + query).
# www.nexusinsight.io est mappé sur le même service Cloud Run.
server {
  listen 8080;
  server_name www.nexusinsight.io;
  return 301 https://nexusinsight.io$request_uri;
}

server {
  listen       8080 default_server;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # Cloud Run termine HTTPS sur un proxy externe ; n'écris jamais d'absolute :8080
  absolute_redirect off;
  port_in_redirect off;

  # ⚠️ Héritage nginx : un add_header dans une location ANNULE ceux du niveau server.
  # Les headers de sécurité sont donc répétés dans chaque location qui en définit un.

  location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  }

  location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
