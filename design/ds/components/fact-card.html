<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,600&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:28px; background:#F5F6F8; font-family:'Switzer',system-ui,sans-serif; display:flex; justify-content:center; }
  .fact { width:380px; background:#1E2126; color:#F5F6F8; padding:26px 24px; border-radius:6px; }
  .row { display:flex; justify-content:space-between; gap:16px; padding:12px 0; font-size:13.5px;
    border-bottom:1px solid rgba(245,246,248,.14); }
  .row:last-child { border-bottom:0; }
  .k { color:#A9ADB5; font:500 11px 'JetBrains Mono',monospace; letter-spacing:.1em; text-transform:uppercase; }
  .v { font-weight:600; text-align:right; }
  .v.c { color:#C97E48; }
</style></head><body>
<div class="fact">
  <div class="row"><span class="k">Scope</span><span class="v">in writing, frozen</span></div>
  <div class="row"><span class="k">Price</span><span class="v c">known upfront</span></div>
  <div class="row"><span class="k">Deliverable</span><span class="v">verifiable</span></div>
  <div class="row"><span class="k">Code</span><span class="v">yours, repo included</span></div>
  <div class="row"><span class="k">Engagement</span><span class="v">no day rates</span></div>
</div>
</body></html>
