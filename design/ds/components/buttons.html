<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://api.fontshare.com/v2/css?f[]=switzer@500,600&display=swap" rel="stylesheet">
<style>
  body { margin:0; font-family:'Switzer',system-ui,sans-serif; }
  .half { padding:28px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .light { background:#F5F6F8; }
  .dark { background:#1E2126; }
  a { text-decoration:none; padding:11px 22px; border-radius:4px; font-weight:600; font-size:14px; display:inline-block; }
  .p-l { background:#1E2126; color:#fff; }
  .g-l { border:1.5px solid #DDE0E6; color:#1E2126; }
  .p-d { background:#C97E48; color:#1C1408; }
  .g-d { border:1.5px solid rgba(245,246,248,.14); color:#F5F6F8; }
  .o-d { border:1.5px solid #C97E48; color:#C97E48; }
</style></head><body>
<div class="half light"><a class="p-l" href="#">Book a call</a><a class="g-l" href="#">See the offers</a></div>
<div class="half dark"><a class="p-d" href="#">Book a call</a><a class="g-d" href="#">See the offers</a><a class="o-d" href="#">Details</a></div>
</body></html>
