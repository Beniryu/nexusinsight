<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600&f[]=switzer@400,600&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:28px; background:#F5F6F8; font-family:'Switzer',system-ui,sans-serif; display:flex; justify-content:center; }
  .card { width:340px; background:#1E2126; color:#F5F6F8; border-radius:6px; padding:24px 22px 20px;
    display:flex; flex-direction:column; min-height:300px; transition:transform .16s cubic-bezier(.4,0,.2,1), background .16s; }
  .card:hover { transform:translateY(-3px); background:#282C33; }
  .tag { font:500 10.5px 'JetBrains Mono',monospace; letter-spacing:.13em; text-transform:uppercase; color:#C97E48; }
  h3 { font:600 21px 'Clash Display',sans-serif; margin:12px 0 0; }
  p { margin:10px 0 0; font-size:14px; line-height:1.55; color:#A9ADB5; }
  .price { margin-top:auto; padding-top:20px; font:600 27px 'Clash Display',sans-serif; }
  .price small { font:500 10.5px 'JetBrains Mono',monospace; display:block; margin-top:5px; letter-spacing:.05em; color:#C97E48; }
  .go { margin-top:14px; font-weight:600; font-size:14px; color:#C97E48; text-decoration:none; }
</style></head><body>
<article class="card">
  <span class="tag">01 · 3 weeks</span>
  <h3>Discovery Sprint</h3>
  <p>Scope, priorities, clickable prototype — and a firm quote for the build. Fixed dates. Yours to keep.</p>
  <div class="price">€9,500<small>FIXED · $11,000</small></div>
  <a class="go" href="#">Details →</a>
</article>
</body></html>
