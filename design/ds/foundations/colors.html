<!-- @dsCard group="Colors" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:24px; background:#F5F6F8; font-family:'JetBrains Mono',ui-monospace,monospace; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .sw { border-radius:6px; overflow:hidden; border:1px solid #DDE0E6; }
  .sw .c { height:64px; }
  .sw .l { padding:8px 10px; font-size:10px; color:#5F6570; background:#fff; line-height:1.5; }
  .sw .l b { display:block; color:#1E2126; font-weight:500; }
</style></head><body>
<div class="grid">
  <div class="sw"><div class="c" style="background:#1E2126"></div><div class="l"><b>graphite</b>#1E2126</div></div>
  <div class="sw"><div class="c" style="background:#282C33"></div><div class="l"><b>graphite-2</b>#282C33</div></div>
  <div class="sw"><div class="c" style="background:#F5F6F8"></div><div class="l"><b>paper</b>#F5F6F8</div></div>
  <div class="sw"><div class="c" style="background:#FFFFFF"></div><div class="l"><b>white</b>#FFFFFF</div></div>
  <div class="sw"><div class="c" style="background:#C97E48"></div><div class="l"><b>copper</b>#C97E48 · sur sombre</div></div>
  <div class="sw"><div class="c" style="background:#A45F2E"></div><div class="l"><b>copper-deep</b>#A45F2E · sur clair</div></div>
  <div class="sw"><div class="c" style="background:#5F6570"></div><div class="l"><b>muted-l</b>#5F6570</div></div>
  <div class="sw"><div class="c" style="background:#A9ADB5"></div><div class="l"><b>muted-d</b>#A9ADB5</div></div>
</div>
</body></html>
